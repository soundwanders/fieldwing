name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: npm run build

      - name: Run Tests
        run: npm run test
